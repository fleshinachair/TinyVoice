<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyVoice</title>
<style>
/* TinyVoice: the Remote UI panel (move.local:7700/remote-ui), one set of panels per engine (the tabs
 * switch the engine): Vocoder (Voice, Pitch, Space / Gate / Freeze), Synth Voice (Vowel, Character) and Resynth
 * (Pitch, Synthesize, Filter, Utility, Effects, Output, laid out by the plugin it is modelled on). Built from the module's own chain_params
 * (range, options): floats are dials (drag up/down, Shift for fine, wheel, arrow keys,
 * double-click = default), Off/On params are switches, short option lists are segmented
 * buttons. Values show in real units (Hz, notes, dB) where the engine's mapping is known.
 * The header steps through the Resynth presets on the Move; Import .baby loads a Humanoid
 * preset file straight to it. */
:root{
  --bg:#0a0b0e; --panel:#15171c; --panel2:#1b1e24; --line:#262a33; --txt:#e4e8ef; --dim:#9aa2b1; --faint:#646c7a;
  --a:#7cc7ff; --cap1:#3a3f4a; --cap2:#1d2027; --warn:#ffb86b;
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1a1d24,var(--bg));background-color:var(--bg);color:var(--txt);
  font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
.wrap{max-width:1440px;margin:0 auto;padding:14px 16px 36px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:14px;padding:10px 14px;
  background:linear-gradient(#1b1e24,#14161b);border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 0 #ffffff08 inset}
.brand{font-weight:800;letter-spacing:.32em;font-size:13px}
.brand i{font-style:normal;color:var(--a)}
.hint{color:var(--faint);font-size:11px}
.sp{flex:1}
button,select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
button:hover,select:hover{border-color:#3b4250}
button:focus-visible,select:focus-visible,.dial:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#engineBtn.on{border-color:#2f6b45;background:#173322;color:#9ff0bd}
/* preset stepper: an LCD strip */
.preset{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#07080a}
.preset button{border:0;border-radius:0;background:#14161b;padding:6px 11px;font-size:13px}
.preset .lcd{min-width:220px;max-width:340px;padding:5px 12px;font:600 12px/1.2 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:#9fe6ff;
  text-shadow:0 0 6px #4cc3ff55;display:flex;flex-direction:column;justify-content:center}
.preset .lcd small{color:#4f6b7a;font-weight:500;font-size:10px;text-shadow:none}
.preset .lcd span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{opacity:.38;transition:opacity .2s}
.bank{margin-right:2px}
.seg.wrap{display:flex;flex-wrap:wrap;gap:4px;max-width:100%;border:0;background:transparent;overflow:visible}
.seg.wrap button{border:1px solid #333944!important;border-radius:6px;background:#111317}
.hide{display:none!important}
.tabs button{padding:6px 14px;font-size:12px;font-weight:600}
#drop{border:1px dashed #3a404c;border-radius:7px;padding:6px 11px;color:var(--dim);cursor:pointer}
#drop.over{border-color:var(--a);color:var(--a)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:1fr}.preset .lcd{min-width:0;flex:1}.preset{flex:1 1 100%}}
.panel{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel) 120px);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px 12px;box-shadow:0 10px 24px #00000040}
.panel::before{content:"";position:absolute;left:14px;right:14px;top:0;height:2px;border-radius:0 0 2px 2px;background:var(--a);opacity:.75}
.panel h2{margin:2px 0 10px;font-size:11px;letter-spacing:.3em;color:var(--a);font-weight:700}
.p-pitch{--a:#ffb454}.p-synth{--a:#7cc7ff}.p-filter{--a:#b79bff}.p-util{--a:#6ee7a8}.p-fx{--a:#ff86bf}.p-out{--a:#e9edf3}
.sec{margin:6px 0 10px;padding-top:8px;border-top:1px solid #ffffff0a}
.sec:first-of-type{border-top:0;padding-top:0}
.sec h3{margin:0 0 6px;font-size:9.5px;letter-spacing:.2em;color:var(--faint);font-weight:700}
.sws{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;margin-bottom:6px}
.dials{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:flex-start}
/* dial */
.dial{width:62px;display:flex;flex-direction:column;align-items:center;user-select:none;touch-action:none;cursor:ns-resize;border-radius:8px;padding:2px 0}
.dial.hero{width:84px}
.dial svg{display:block;overflow:visible}
.dial .trk{fill:none;stroke:#2a2f39;stroke-width:4;stroke-linecap:round}
.dial .val{fill:none;stroke:var(--a);stroke-width:4;stroke-linecap:round;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--a) 45%,transparent))}
.dial .cap{fill:url(#capg);stroke:#00000080;stroke-width:1}
.dial .ptr{stroke:#f2f5f9;stroke-width:2.2;stroke-linecap:round}
.dial .zero{stroke:#4a515e;stroke-width:1.5}
.dial .dl{margin-top:1px;font-size:10.5px;color:var(--dim);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dial.hero .dl{color:var(--txt);font-weight:600;font-size:11.5px}
.dial .dv{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--txt);opacity:.85;white-space:nowrap}
.dial:hover .val,.dial.drag .val{stroke-width:5}
/* switch */
.swc{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.swc .lab{font-size:10px;color:var(--dim)}
.tog{position:relative;width:40px;height:22px;border-radius:11px;padding:0;background:#22262e;border:1px solid #333944;transition:background .15s,border-color .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:linear-gradient(#cfd5de,#8f98a6);
  box-shadow:0 1px 3px #0008;transition:left .15s}
.tog.on{background:color-mix(in srgb,var(--a) 35%,#1b1e24);border-color:var(--a)}
.tog.on::after{left:20px;background:linear-gradient(#ffffff,#d6dbe3)}
/* segmented */
.seg{display:inline-flex;border:1px solid #333944;border-radius:7px;overflow:hidden;background:#111317}
.seg button{border:0;border-radius:0;padding:4px 9px;background:transparent;color:var(--dim);font-size:11px}
.seg button+button{border-left:1px solid #2a2f38}
.seg button.on{background:color-mix(in srgb,var(--a) 28%,#15171c);color:#fff;box-shadow:inset 0 -2px 0 var(--a)}
select.sel{padding:4px 8px;font-size:11px}
/* displays */
canvas{width:100%;height:96px;background:linear-gradient(#0b0d11,#07080a);border:1px solid var(--line);border-radius:7px;display:block;margin:2px 0 10px}
/* the scale keyboard: a small piano */
.piano{position:relative;height:58px;margin:4px 0 10px;user-select:none}
.piano button{position:absolute;padding:0;border-radius:0 0 5px 5px;font-size:9px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px}
.piano .w{top:0;height:58px;background:linear-gradient(#e9ecf1,#c4cad3);color:#555c68;border:1px solid #0b0c0f}
.piano .b{top:0;height:35px;z-index:2;background:linear-gradient(#2b2f37,#111318);color:#8a93a1;border:1px solid #000}
.piano .w.on{background:linear-gradient(color-mix(in srgb,var(--a) 55%,#fff),var(--a));color:#2b1a00}
.piano .b.on{background:linear-gradient(color-mix(in srgb,var(--a) 80%,#000),color-mix(in srgb,var(--a) 45%,#000));color:#fff}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f3b52;border:1px solid #2f5f86;color:#fff;padding:8px 15px;border-radius:7px;
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
.err{color:var(--warn);padding:12px}
.foot{margin-top:6px;color:var(--faint);font-size:11px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <radialGradient id="capg" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="#4a505c"/><stop offset=".55" stop-color="#2a2e36"/><stop offset="1" stop-color="#181a20"/></radialGradient>
</defs></svg>
<div class="wrap">
<header>
  <div class="brand">TINYVOICE <i id="brandE">…</i></div>
  <span class="hint" id="hint">connecting…</span>
  <div class="sp"></div>
  <div class="seg tabs" id="tabs" title="The engine TinyVoice runs">
    <button data-e="Vocoder">Vocoder</button><button data-e="Synth Voice">Synth Voice</button><button data-e="Resynth">Resynth</button>
  </div>
  <div class="seg bank" id="bankSeg" title="Default: presets shipped with TinyVoice. Imported: yours (imported Humanoid presets, and anything you saved on the Move)">
    <button data-b="Default">Default</button><button data-b="Imported">Imported</button>
  </div>
  <div class="preset" title="The presets of the chosen bank on the Move">
    <button id="prevP" aria-label="Previous preset">&#9664;</button>
    <div class="lcd"><small id="pIdx">PRESET</small><span id="pName">…</span></div>
    <button id="nextP" aria-label="Next preset">&#9654;</button>
  </div>
  <label id="drop" title="Drop a .baby preset here, or click to choose one">Import .baby <input type="file" id="file" accept=".baby" multiple hidden></label>
</header>
<div class="grid hide" id="gridV"></div>
<div class="grid hide" id="gridF"></div>
<div class="grid hide" id="gridR"></div>
</div>
<div id="toast"></div>

<script src="/static/schwung-remote-api.js"></script>
<script>
(function () {
"use strict";
var R = window.schwungRemote;
var COMP = (R && R.component) || "synth";
var KP = COMP + ":";
var META = {};          /* key -> chain_params entry */
var CTL = {};           /* key -> {set(value)} */
var VAL = {};           /* key -> last value (number; enums: index) */
var HELD = null;        /* the key being turned: incoming values for it are ignored meanwhile */
var NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
var SVGNS = "http://www.w3.org/2000/svg";

function el(tag, cls, parent, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function sv(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove("show"); }, 2500);
}
/* writes are coalesced to one per key per animation frame (a dial drag fires far faster) */
var pending = {}, flushQ = false;
function send(key, v) {
  if (!R) return;
  pending[key] = String(v);
  if (flushQ) return;
  flushQ = true;
  requestAnimationFrame(function () {
    flushQ = false;
    var p = pending; pending = {};
    for (var k in p) R.setParam(KP + k, p[k]);
  });
}
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/* ---------- value text in real units */
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function noteName(m) { m = Math.round(m); return NOTE[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1); }
function fmtHz(h) { return h >= 1000 ? (h / 1000).toFixed(h >= 10000 ? 1 : 2) + " kHz" : Math.round(h) + " Hz"; }
var FMT = {
  hm_hpf_freq: function (v) { return v <= 10.5 ? "off" : fmtHz(midiHz(v)); },
  hm_lpf_freq: function (v) { return v >= 137.5 ? "off" : fmtHz(midiHz(v)); },
  hm_filter_freq: function (v) { return fmtHz(midiHz(v)); },
  hm_pitch_mono: noteName, hm_pitch_duo: noteName, hm_min_f0: noteName, hm_max_f0: noteName,
  hm_pitch_shift: function (v) { return (v > 0 ? "+" : "") + Math.round(v) + " st"; },
  hm_octaving: function (v) { return v < -0.005 ? "down " + Math.round(-v * 100) + "%" : v > 0.005 ? "up " + Math.round(v * 100) + "%" : "off"; },
  hm_formant_shift: function (v) { return (v > 0 ? "+" : "") + (v * 12).toFixed(1) + " st"; },
  hm_warble_rate: function (v) { return v < 0 ? "sync" : (10.1 * v).toFixed(1) + " Hz"; },
  hm_noisegate_threshold: function (v) { return v <= -79.5 ? "off" : v.toFixed(0) + " dB"; },
  hm_mask: function (v) { return String(Math.round(v)); },
  vf_vowel: function (v) { var L = ["A", "E", "I", "O", "U"], q = v * 4, i = Math.min(3, Math.floor(q)), t = q - i; return t < 0.12 ? L[i] : t > 0.88 ? L[i + 1] : L[i] + "\u00b7" + L[i + 1]; }
};
function fmt(key, v) {
  var m = META[key];
  if (!m) return String(v);
  if (m.type === "enum") return m.options[v] || String(v);
  if (FMT[key]) return FMT[key](v);
  if (m.unit === "%") return (m.max <= 1 ? Math.round(v * 100) : Math.round(v)) + "%";
  if (m.unit === "s") return v < 1 ? Math.round(v * 1000) + " ms" : v.toFixed(2) + " s";
  if (m.unit) return (Math.abs(v) < 10 && m.step < 1 ? v.toFixed(1) : Math.round(v)) + " " + m.unit;
  if (m.min === 0 && m.max === 1) return Math.round(v * 100) + "%";
  return (Math.abs(v) < 10 ? v.toFixed(2) : v.toFixed(0));
}
function parseVal(key, s) {
  var m = META[key];
  if (!m) return parseFloat(s);
  if (m.type === "enum") {
    var i = m.options.indexOf(s);
    if (i < 0) for (var j = 0; j < m.options.length; j++) if (m.options[j].toLowerCase() === String(s).toLowerCase()) i = j;
    if (i < 0) i = parseInt(s, 10);
    return isNaN(i) ? 0 : i;
  }
  return parseFloat(s);
}

/* ---------- controls */
/* A key can have several controls (Latch and Demo sit on more than one engine's panels): they are merged so one value updates them all. */
function reg(key, c) {
  var q = CTL[key];
  if (!q) { c.boxes = [c.box]; CTL[key] = c; return; }
  var ps = q.set, cs = c.set, pl = q.setLabel, cl = c.setLabel;
  q.set = function (v) { ps(v); cs(v); };
  q.setLabel = function (t) { if (pl) pl(t); if (cl) cl(t); };
  q.boxes.push(c.box);
}
var A0 = -135, A1 = 135;
function polar(c, r, a) { var t = (a - 90) * Math.PI / 180; return [c + r * Math.cos(t), c + r * Math.sin(t)]; }
function arcPath(c, r, a, b) {
  if (b < a) { var t = a; a = b; b = t; }
  var p = polar(c, r, a), q = polar(c, r, b);
  return "M" + p[0].toFixed(2) + " " + p[1].toFixed(2) + " A" + r + " " + r + " 0 " + (b - a > 180 ? 1 : 0) + " 1 " + q[0].toFixed(2) + " " + q[1].toFixed(2);
}

/* A dial: drag up/down (Shift = fine), wheel, arrow keys; double-click = default. Ranges that
 * span 0 (Shift, Formant, gains, the Shape coefficients) light from the centre. */
function dial(parent, key, hero) {
  var m = META[key];
  if (!m) return;
  var isEnum = m.type === "enum";                      /* a long option list (Gate) is a stepped dial */
  var S = hero ? 66 : 48, c = S / 2, r = S / 2 - 4, lo = isEnum ? 0 : m.min, hi = isEnum ? m.options.length - 1 : m.max;
  var bip = lo < 0 && hi > 0, step = isEnum ? 1 : (m.step || 0.01);
  var dflt = isEnum ? (m.default | 0) : m.default;
  var box = el("div", "dial" + (hero ? " hero" : ""), parent);
  box.tabIndex = 0;
  box.setAttribute("data-key", key);
  box.title = m.name + " — drag or scroll (Shift: fine), double-click for the default";
  box.setAttribute("role", "slider");
  box.setAttribute("aria-label", m.name);
  var svg = sv("svg", { width: S, height: S, viewBox: "0 0 " + S + " " + S }, box);
  sv("path", { d: arcPath(c, r, A0, A1), "class": "trk" }, svg);
  if (bip) { var z0 = A0 + (0 - lo) / (hi - lo) * (A1 - A0), zp = polar(c, r + 3.5, z0), zq = polar(c, r - 3.5, z0);
             sv("line", { x1: zp[0], y1: zp[1], x2: zq[0], y2: zq[1], "class": "zero" }, svg); }
  var val = sv("path", { "class": "val" }, svg);
  sv("circle", { cx: c, cy: c, r: r - 7, "class": "cap" }, svg);
  var ptr = sv("line", { "class": "ptr" }, svg);
  var dl = el("div", "dl", box, m.name);
  var vt = el("div", "dv", box);
  var cur = NaN;
  var norm = function (v) { return (v - lo) / (hi - lo); };
  function draw(v) {
    var a = A0 + clamp(norm(v), 0, 1) * (A1 - A0), z = bip ? A0 + norm(0) * (A1 - A0) : A0;
    val.setAttribute("d", Math.abs(a - z) < 0.6 ? "" : arcPath(c, r, z, a));
    var p = polar(c, (r - 7) * 0.28, a), q = polar(c, r - 9, a);
    ptr.setAttribute("x1", p[0]); ptr.setAttribute("y1", p[1]); ptr.setAttribute("x2", q[0]); ptr.setAttribute("y2", q[1]);
  }
  function show(v) { cur = v; VAL[key] = v; draw(v); vt.textContent = fmt(key, v); box.setAttribute("aria-valuetext", vt.textContent); after(key); }
  function quant(v) {
    v = clamp(v, lo, hi);
    if (step >= 1) v = lo + Math.round((v - lo) / step) * step;
    else v = Math.round(v * 10000) / 10000;
    return v;
  }
  function setv(v) { v = quant(v); if (v === cur) return; show(v); send(key, v); }
  var yl = 0, nd = 0;                    /* incremental, so Shift can come and go mid-drag */
  box.addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    box.setPointerCapture(e.pointerId); box.classList.add("drag"); HELD = key;
    yl = e.clientY; nd = norm(isNaN(cur) ? dflt : cur);
    e.preventDefault(); box.focus();
  });
  box.addEventListener("pointermove", function (e) {
    if (!box.hasPointerCapture(e.pointerId)) return;
    nd = clamp(nd + (yl - e.clientY) / (e.shiftKey ? 900 : 180), 0, 1);
    yl = e.clientY;
    setv(lo + nd * (hi - lo));
  });
  var end = function (e) { if (box.hasPointerCapture(e.pointerId)) box.releasePointerCapture(e.pointerId); box.classList.remove("drag"); HELD = null; };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
  box.addEventListener("dblclick", function () { setv(dflt); });
  var nudge = function (dir, fine) { var d = step >= 1 ? step : (hi - lo) / (fine ? 500 : 100); setv((isNaN(cur) ? dflt : cur) + dir * d); };
  box.addEventListener("wheel", function (e) { e.preventDefault(); nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey); }, { passive: false });
  box.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp" || e.key === "ArrowRight") { nudge(1, e.shiftKey); e.preventDefault(); }
    else if (e.key === "ArrowDown" || e.key === "ArrowLeft") { nudge(-1, e.shiftKey); e.preventDefault(); }
    else if (e.key === "Home") { setv(dflt); e.preventDefault(); }
  });
  reg(key, { set: show, box: box, setLabel: function (t) { dl.textContent = t; box.setAttribute("aria-label", t); box.title = t + " — drag or scroll (Shift: fine), double-click for the default"; } });
  show(dflt);
}

/* Off/On -> a switch; a few short options -> segmented buttons; many -> a menu */
function chooser(parent, key) {
  var m = META[key];
  if (!m) return;
  var box = el("div", "swc", parent);
  el("span", "lab", box, m.name);
  var o = m.options, upd;
  if (o.length === 2 && o[0] === "Off" && o[1] === "On") {
    var t = el("button", "tog", box);
    t.setAttribute("role", "switch"); t.setAttribute("aria-label", m.name);
    t.onclick = function () { var v = VAL[key] ? 0 : 1; send(key, o[v]); upd(v); };
    upd = function (i) { VAL[key] = i; t.classList.toggle("on", i === 1); t.setAttribute("aria-checked", i === 1); after(key); };
  } else if (o.length <= 14) {
    var seg = el("div", o.length <= 5 ? "seg" : "seg wrap", box), btns = [];
    o.forEach(function (name, i) { var b = el("button", "", seg, name); b.onclick = function () { send(key, name); upd(i); }; btns.push(b); });
    upd = function (i) { VAL[key] = i; btns.forEach(function (b, j) { b.classList.toggle("on", j === i); }); after(key); };
  } else {
    var s = el("select", "sel", box);
    o.forEach(function (name, i) { var op = el("option", "", s, name); op.value = i; });
    s.onchange = function () { var i = parseInt(s.value, 10); send(key, o[i]); upd(i); };
    upd = function (i) { VAL[key] = i; s.value = i; after(key); };
  }
  reg(key, { set: upd, box: box });
  upd(m.default | 0);
}

/* a titled section: its switches first, then its dials (the first dial large when `hero`) */
function group(parent, title, keys, hero) {
  var sec = el("div", "sec", parent);
  if (title) el("h3", "", sec, title);
  var sws = null, dials = null, first = true;
  keys.forEach(function (k) {
    var m = META[k];
    if (!m) return;

function importBaby(text, name) {
  var doc = new DOMParser().parseFromString(text, "application/xml");
  if (!doc.querySelector("Humanoid")) { toast(name + ": not a Humanoid preset"); return; }
  send("engine", "Resynth"); VAL.engine = 2; after("engine");
  doc.querySelectorAll("Humanoid > PARAM").forEach(function (p) {
    var id = p.getAttribute("id"), v = p.getAttribute("value"), key = "hm_" + id, m = META[key];
    if (!m || v === null || id === "freeze") return;
    var f = parseFloat(v);
    if (isNaN(f)) return;
    if (m.type === "enum") { f = Math.max(0, Math.min(m.options.length - 1, Math.round(f))); send(key, f); CTL[key] && CTL[key].set(f); }
    else { f = Math.max(m.min, Math.min(m.max, f)); send(key, f); CTL[key] && CTL[key].set(f); }

    send("hm_tuning_duophonic", duo); CTL.hm_tuning_duophonic && CTL.hm_tuning_duophonic.set(duo);
    var an = tt.querySelector("tuning_auto_notes");
    if (an && VAL.hm_scale_hold === 1) toast("Kept your Key / Scale (Hold Scale is on)");
    else if (an) {
      var mask = 0;
      for (var i = 0; i < 12; i++) if (an.getAttribute("_" + i) === "1") mask |= 1 << i;
      send("hm_mask", mask); send("hm_scale", "Custom");
      CTL.hm_mask.set(mask); CTL.hm_scale && CTL.hm_scale.set(3);
    }

  if (wt && wt.getAttribute("wavetable_base64")) {

    for (j = 0; j < n; j++) { src[j] = dv.getFloat32(4 * j, true); peak = Math.max(peak, Math.abs(src[j])); }
    n = pad;
    var out = "", N = 512;
    for (j = 0; j < N; j++) {
      var pos = j * n / N, a = Math.floor(pos), t = pos - a;
      var v = (src[a % n] * (1 - t) + src[(a + 1) % n] * t) / peak;
      var s = Math.round(Math.max(-1, Math.min(1, v)) * 32767); if (s < 0) s += 65536;
      out += String.fromCharCode(s & 255, s >> 8);
    }
    var b64 = btoa(out);
    send("hm_wt", b64); send("hm_wave", "Preset");
    wtCycle = b64ToCycle(b64); CTL.hm_wave && CTL.hm_wave.set(4);
  }
  drawWave(); drawFilter(); drawKeys(); after("hm_autolevel");
  toast("Loaded " + name.replace(/\.baby$/i, "") + " (save it on the Move: My Presets)");
}
function readFiles(files) {
  [].forEach.call(files, function (f) {
    var r = new FileReader();
    r.onload = function () { importBaby(String(r.result), f.name); };
    r.readAsText(f);
  });
}

/* ---------- start */
function incoming(key, v) {
  if (key === "hm_wt") { wtCycle = v ? b64ToCycle(v) : null; drawWave(); return; }
  if (key === HELD || !CTL[key]) return;
  var x = parseVal(key, v);
  if (!isNaN(x)) CTL[key].set(x);
}
function start(cp) {
  cp.forEach(function (c) { if (c && c.key) META[c.key] = c; });
  buildResynth(); buildVocoder(); buildVoiceFX();
  if (META.engine) VAL.engine = META.engine.default | 0;
  if (META.mode) VAL.mode = META.mode.default | 0;
  after("engine"); modeChanged();
  document.getElementById("hint").textContent = Object.keys(META).length + " controls · live both ways";
  R.onParamChange(function (p) {
    for (var key in p) {
      if (key.indexOf(KP) !== 0) continue;
      var k = key.substring(KP.length);
      if (k === "engine") { VAL.engine = parseVal("engine", p[key]); after("engine"); }
      else incoming(k, p[key]);
    }
  });
  refreshAll();
  readPreset();
  /* a preset chosen on the Move: follow it */
  setInterval(function () { if (!document.hidden && !HELD) readPreset().then(function (ch) { if (ch) refreshAll(); }); }, 1500);
  [].forEach.call(document.querySelectorAll("#bankSeg button"), function (b) {
    b.onclick = function () {
      P.bank = b.getAttribute("data-b"); P.i = 0; showPreset();
      R.setParam(KP + "rs_bank", P.bank);
      setTimeout(readPreset, 150);
    };
  });
  document.getElementById("prevP").onclick = function () { stepPreset(-1); };
  document.getElementById("nextP").onclick = function () { stepPreset(1); };
  [].forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.onclick = function () { var n = b.getAttribute("data-e"); send("engine", n); VAL.engine = META.engine.options.indexOf(n); after("engine"); };
  });
  var drop = document.getElementById("drop"), file = document.getElementById("file");
  drop.onclick = function (e) { if (e.target !== file) file.click(); };
  file.onchange = function () { readFiles(file.files); file.value = ""; };
  ["dragenter", "dragover"].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  document.addEventListener("dragleave", function () { drop.classList.remove("over"); });
  document.addEventListener("drop", function (e) { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files.length) readFiles(e.dataTransfer.files); });
  window.addEventListener("resize", function () { drawWave(); drawFilter(); drawVowel(); });
}
function fail(msg) { el("div", "err", document.body, msg); document.getElementById("hint").textContent = "not connected"; }
if (!R || !R.getChainParams) fail("The Schwung remote API is not available on this page (open it from move.local:7700/remote-ui).");
else R.getChainParams().then(start).catch(function () { fail("Could not read the module's parameters."); });
})();
